<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Estudário</title>
  <meta name="description" content="Seu plano de estudos para concursos também no computador: plano do dia, edital, questões e revisões sincronizados com o app.">
  <meta name="theme-color" content="#4F46E5">
  <!-- CSP: só os scripts e serviços que o app usa (Supabase, login Google, Turnstile, pdf.js, fontes).
       Limita o estrago de um script injetado: ele não consegue mandar a sessão para outro domínio. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/ https://challenges.cloudflare.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://*.supabase.co; connect-src 'self' https://*.supabase.co https://accounts.google.com/gsi/ https://challenges.cloudflare.com https://cdnjs.cloudflare.com; frame-src https://accounts.google.com https://challenges.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="folha.js"></script>
  <script src="folha-live.js"></script>
  <script src="turma.js"></script>
  <script src="profile-art.js" defer></script>
  <!-- Só a turma e o Folha bloqueiam (a abertura usa os dois); o resto baixa em paralelo e roda em ordem. -->
  <script src="process.js" defer></script>
  <script src="offline.js"></script>
  <script src="highlight.js" defer></script>
  <script src="ambient.js" defer></script>
  <script src="rocket.js" defer></script>
  <script src="workshop.js" defer></script>
  <!-- KaTeX 0.16.11 (MIT, katex.min.js): carregado só quando aparece a primeira fórmula (Markdown.kt). -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!-- Abertura: aparece antes do app carregar (só HTML e CSS); splash.js põe a turma em órbita e o app
       a dissolve quando os estudos estão prontos (App.kt). -->
  <div id="splash" role="status" aria-live="polite" aria-label="Abrindo o Estudário">
    <div class="sp-stage">
      <div class="sp-glow"></div>
      <div class="sp-ring"></div>
      <div class="sp-orbit" id="sp-orbit"></div>
      <div class="sp-folha"><estudario-folha mood="happy" size="132"></estudario-folha></div>
    </div>
    <div class="sp-brand"><span class="sp-word">estud<em>á</em>rio</span><span class="sp-tag">do edital à aprovação</span></div>
    <div class="sp-bar"><i></i></div>
    <div class="sp-msgs" aria-hidden="true"><span>Abrindo seu caderno…</span><span>Conferindo o plano de hoje…</span><span>Chamando a turma…</span><span>Quase lá!</span></div>
  </div>
  <div id="root"></div>
  <noscript>O Estudário precisa de JavaScript ligado.</noscript>
  <script src="splash.js" defer></script>
  <script src="estudario.js" defer></script>
</body>
</html>
