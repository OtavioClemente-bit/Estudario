<!doctype html>
<html lang="pt-BR" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conferência dos desenhos do perfil</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--line-strong:#C9C6BB;--bg:#FAF9F5;--ink:#302544} :root[data-theme=dark]{--line-strong:#48473F;--bg:#15142A;--ink:#EEE9FF}
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:Nunito,sans-serif}h1{font-size:24px}nav{display:flex;gap:12px;flex-wrap:wrap}button,select{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #9E96B1;background:var(--bg);color:var(--ink)}section{display:flex;gap:24px;flex-wrap:wrap;margin:30px 0}article{text-align:center;min-width:150px}estudario-profile-art{--profile-art-size:136px;--profile-art-track:var(--line-strong)}.small{--profile-art-size:48px}label{display:grid;gap:4px}p{margin:8px 0}
</style>
<script src="profile-art.js" defer></script>
<h1>Livros, sequência e conquistas</h1>
<nav><button onclick="document.documentElement.dataset.theme='light'">Tema claro</button><button onclick="document.documentElement.dataset.theme='dark'">Tema escuro</button><label>Nível do livro<select aria-label="Nível do livro" onchange="document.getElementById('selected-book').setAttribute('level',this.value)"><option>1</option><option>5</option><option>10</option><option>20</option><option>30</option><option>40</option><option>50</option><option>100</option><option>200</option></select></label></nav>
<section><article><estudario-profile-art id="selected-book" kind="level" level="1"></estudario-profile-art><p>Livro selecionado</p></article><article><estudario-profile-art kind="level" level="50"></estudario-profile-art><p>Nível 50</p></article><article><estudario-profile-art kind="flame" lit="true"></estudario-profile-art><p>Sequência acesa</p></article><article><estudario-profile-art kind="flame" lit="false" frozen="true"></estudario-profile-art><p>Sequência perdida</p></article></section>
<section><article><estudario-profile-art class="small" kind="badges"></estudario-profile-art><p>Emblemas</p></article><article><estudario-profile-art class="small" kind="goal" fraction="0.4"></estudario-profile-art><p>Meta em 40%</p></article><article><estudario-profile-art class="small" kind="goal" fraction="1" done="true"></estudario-profile-art><p>Meta concluída por tarefa</p></article></section>
</html>
