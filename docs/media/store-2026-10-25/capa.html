<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estudário — capa da Play Store (1024 × 500)</title>
<style>
  @font-face { font-family: "Nunito"; font-weight: 800; src: url("../../../app/src/main/res/font/nunito_800.ttf"); }
  @font-face { font-family: "Nunito"; font-weight: 900; src: url("../../../app/src/main/res/font/nunito_900.ttf"); }
  html, body { margin: 0; overflow: hidden; }
  #c { position: relative; width: 1024px; height: 500px; overflow: hidden; font-family: "Nunito", sans-serif; color: #fff;
    background:
      radial-gradient(520px 420px at 760px 330px, rgba(98, 78, 255, .7), transparent 70%),
      radial-gradient(380px 300px at 160px 470px, rgba(126, 224, 184, .18), transparent 70%),
      radial-gradient(420px 300px at 980px 60px, rgba(255, 168, 40, .2), transparent 70%),
      linear-gradient(180deg, #140E3A 0%, #0D0A24 100%); }
  #c svg.bg { position: absolute; inset: 0; }
  .txt { position: absolute; left: 56px; top: 64px; width: 470px; z-index: 5; }
  .brand { display: inline-block; font-weight: 900; font-size: 34px; letter-spacing: -1px; padding: 0 5px;
    background: linear-gradient(transparent 60%, rgba(255, 210, 63, .9) 60%, rgba(255, 210, 63, .9) 90%, transparent 90%); }
  .brand em { font-style: normal; color: #FFD23F; }
  h1 { margin: 22px 0 0; font-weight: 900; font-size: 66px; line-height: .98; letter-spacing: -2.6px; }
  h1 mark { color: #FFD23F; background: linear-gradient(transparent 60%, rgba(123, 107, 255, .85) 60%, rgba(123, 107, 255, .85) 92%, transparent 92%); padding: 0 5px; margin: 0 -3px; }
  p { margin: 18px 0 0; font-weight: 800; font-size: 22px; line-height: 1.3; color: #D3CFF5; }
  .phone { position: absolute; width: 230px; height: 470px; border-radius: 36px; padding: 7px; box-sizing: border-box; background: #191637;
    box-shadow: 0 0 0 5px #fff, 0 13px 0 5px #3E2FC9, 0 30px 60px rgba(4, 2, 24, .75); }
  .phone .scr { width: 100%; height: 100%; border-radius: 30px; overflow: hidden; }
  .phone img { width: 100%; display: block; }
  .folha { position: absolute; z-index: 6; filter: drop-shadow(0 16px 20px rgba(4, 2, 24, .6)); }
  .medal { position: absolute; z-index: 4; filter: drop-shadow(0 14px 18px rgba(4, 2, 24, .7)); }
  .medal img { width: 100%; display: block; }
</style>
<script src="../../../web/src/jsMain/resources/folha.js"></script>
<script src="../../../web/src/jsMain/resources/folha-live.js"></script>
</head>
<body>
<div id="c">
  <svg class="bg" viewBox="0 0 1024 500" fill="none">
    <defs><linearGradient id="road" x1="0" x2="1024" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7EE0B8"/><stop offset=".5" stop-color="#FFD23F"/><stop offset="1" stop-color="#9C8CFF"/></linearGradient>
      <filter id="soft" x="-20%" y="-200%" width="140%" height="500%" filterUnits="objectBoundingBox"><feGaussianBlur stdDeviation="14"/></filter></defs>
    <g id="stars"></g>
    <path d="M-20 430 C 200 360, 380 470, 560 380 S 860 250, 1050 320" stroke="rgba(123,107,255,.6)" stroke-width="80" filter="url(#soft)" stroke-linecap="round"/>
    <path d="M-20 430 C 200 360, 380 470, 560 380 S 860 250, 1050 320" stroke="url(#road)" stroke-width="9" stroke-linecap="round"/>
    <path d="M-20 430 C 200 360, 380 470, 560 380 S 860 250, 1050 320" stroke="#fff" stroke-width="3" stroke-dasharray="1 15" stroke-linecap="round" opacity=".85"/>
  </svg>
  <div class="txt">
    <div class="brand">estud<em>á</em>rio</div>
    <h1>Do edital à <mark>aprovação</mark>.</h1>
    <p>Plano, matéria, questões e revisão num só app, com o Folha estudando junto.</p>
  </div>
  <div class="medal" style="left:560px;top:60px;width:118px;transform:rotate(-10deg)"><img src="../../../web/src/jsMain/resources/emblemas/g/seq-365.webp"></div>
  <div class="phone" style="left:610px;top:96px;transform:rotate(-5deg);z-index:2"><div class="scr"><img src="telas/questao.png"></div></div>
  <div class="phone" style="left:790px;top:62px;transform:rotate(5deg);z-index:3"><div class="scr"><img src="telas/inicio.png"></div></div>
  <div class="medal" style="left:930px;top:300px;width:110px;transform:rotate(10deg);z-index:5"><img src="../../../web/src/jsMain/resources/emblemas/g/quest-5000.webp"></div>
  <div class="folha" style="left:470px;top:270px"><estudario-folha mood="happy" size="230"></estudario-folha></div>
</div>
<script>
  let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let s = ""; for (let i = 0; i < 110; i++) s += `<circle cx="${(rnd() * 1024).toFixed(0)}" cy="${(Math.pow(rnd(), 1.5) * 380).toFixed(0)}" r="${(0.6 + rnd() * 1.4).toFixed(1)}" fill="#fff" opacity="${(.25 + rnd() * .55).toFixed(2)}"/>`;
  document.getElementById("stars").innerHTML = s;
</script>
</body>
</html>
