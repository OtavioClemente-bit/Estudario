<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estudário — ícone</title>
<!-- Ícone do app. ?v=a|b|c escolhe a versão; ?camada=full (512 da Play), fundo ou frente (432 px =
     108 dp do ícone adaptável: o Folha fica no círculo seguro de 66 dp para nenhum formato cortar). -->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #ic { position: relative; overflow: hidden; }
  .layer { position: absolute; inset: 0; }
  .folha { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .folha img { display: block; width: 100%; height: 100%; }
</style>
<script src="../../../web/src/jsMain/resources/folha.js"></script>
</head>
<body>
<div id="ic"></div>
<script>
  const q = new URLSearchParams(location.search);
  const v = q.get("v") || "a", camada = q.get("camada") || "full";
  const S = camada === "full" ? 512 : 432;            // 512 = Play; 432 = camada do adaptável (108 dp)
  const ic = document.getElementById("ic");
  ic.style.width = ic.style.height = S + "px";
  const k = S / 432;                                    // escala tudo pela grade de 432
  const folha = (mood, size) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    folhaSvg({ mood, size, look: [0, 0], shadow: false, confetti: false, sparkles: false }));

  const fundo = {
    a: `<div class="layer" style="background:radial-gradient(circle at 50% 38%, #4A3BE0 0%, #2A2190 45%, #15113A 100%)"></div>
        <div class="layer" style="background-image:radial-gradient(rgba(255,255,255,.13) ${2.4*k}px, transparent ${2.8*k}px);background-size:${27*k}px ${27*k}px"></div>
        <div class="layer" style="background:radial-gradient(circle at 50% 52%, rgba(255,123,176,.35) 0%, transparent 38%)"></div>
        <svg class="layer" viewBox="0 0 432 432"><path d="M104 300 Q216 268 330 296" stroke="#FFD23F" stroke-opacity=".95" stroke-width="44" stroke-linecap="round" fill="none"/></svg>`,
    b: `<div class="layer" style="background:linear-gradient(160deg, #6D5BFF 0%, #5B4BF5 45%, #3E2FC9 100%)"></div>
        <div class="layer" style="background-image:radial-gradient(rgba(255,255,255,.16) ${2.4*k}px, transparent ${2.8*k}px);background-size:${27*k}px ${27*k}px"></div>
        <svg class="layer" viewBox="0 0 432 432"><path transform="translate(-22 34)" d="M330 92l7 16 17 2-12 12 3 17-15-9-15 9 3-17-12-12 17-2z" fill="#FFD23F" stroke="#26234A" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="122" cy="142" r="7" fill="#7EE0B8"/><circle cx="316" cy="312" r="6" fill="#FF7BB0"/></svg>`,
    c: `<div class="layer" style="background:#FBF6EA"></div>
        <div class="layer" style="background-image:radial-gradient(rgba(38,35,74,.16) ${2.4*k}px, transparent ${2.8*k}px);background-size:${27*k}px ${27*k}px"></div>
        <svg class="layer" viewBox="0 0 432 432"><path d="M84 316 L348 250" stroke="#FFD23F" stroke-width="58" stroke-linecap="round" fill="none"/>
        <path d="M60 60 L60 372" stroke="#FF5C4D" stroke-opacity=".35" stroke-width="5"/></svg>`,
  };
  // O Folha: na B ele é um adesivo (recorte branco e aba de profundidade, como a turma).
  const frente = {
    a: `<div class="folha" style="width:${300*k}px;height:${300*k}px;filter:drop-shadow(0 ${14*k}px ${18*k}px rgba(5,3,30,.55))"><img src="${folha("wink", 300)}"></div>`,
    b: `<div class="folha" style="width:${290*k}px;height:${290*k}px;filter:
          drop-shadow(${6*k}px 0 0 #fff) drop-shadow(-${6*k}px 0 0 #fff) drop-shadow(0 ${6*k}px 0 #fff) drop-shadow(0 -${6*k}px 0 #fff)
          drop-shadow(0 ${10*k}px 0 #26234A)"><img src="${folha("happy", 290)}"></div>`,
    c: `<div class="folha" style="width:${300*k}px;height:${300*k}px;filter:drop-shadow(0 ${12*k}px ${10*k}px rgba(38,35,74,.28))"><img src="${folha("wink", 300)}"></div>`,
  };
  ic.innerHTML = camada === "fundo" ? fundo[v] : camada === "frente" ? frente[v] : fundo[v] + frente[v];
</script>
</body>
</html>
