<!doctype html><meta charset="utf-8">
<!-- Camadas do ícone adaptável do app (432 px = 108 dp em xxxhdpi). ?camada=fundo ou ?camada=frente.
     O Folha cabe no círculo seguro de 66 dp do centro, para nenhum formato de ícone cortar o capelo. -->
<style>
html,body{margin:0;width:432px;height:432px;overflow:hidden;background:transparent}
.bg{position:absolute;inset:0;background:
 radial-gradient(circle at 50% 40%, #6D5BFF 0%, #4F46E5 34%, #2E23B8 66%, #1E1680 100%)}
.glow{position:absolute;left:96px;top:100px;width:240px;height:240px;border-radius:50%;
 background:radial-gradient(circle, rgba(126,224,184,.32), rgba(126,224,184,0) 65%)}
.f{position:absolute;left:96px;top:110px}
</style>
<div id="root"></div>
<script src="folha.js"></script>
<script>
const camada = new URLSearchParams(location.search).get("camada") || "frente";
document.getElementById("root").innerHTML = camada === "fundo"
  ? `<div class="bg"></div><div class="glow"></div>`
  : `<div class="f">${folhaSvg({ mood: "wink", size: 240, look: [0, 0], shadow: false, confetti: false, armColor: "#A9A2FF" })}</div>`;
</script>
