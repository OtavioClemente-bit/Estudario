<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estudário — painel da Play Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  /* Painel contínuo de 6 telas (6 × 1080 × 1920). ?s=0..5 mostra uma tela; sem ?s, o painel todo. */
  :root { --ink: #140F4F; --mint: #7EE0B8; --gold: #F5B83D; --lav: #C9C5F5; }
  html, body { margin: 0; background: var(--ink); overflow: hidden; }
  #wrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
  #canvas { position: absolute; left: 0; top: 0; width: 6480px; height: 1920px; font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 700px at 600px 1300px, rgba(109, 91, 255, .45), transparent 70%),
      radial-gradient(900px 800px at 2200px 1200px, rgba(126, 224, 184, .16), transparent 70%),
      radial-gradient(900px 700px at 2860px 1300px, rgba(109, 91, 255, .42), transparent 70%),
      radial-gradient(1000px 800px at 4320px 1500px, rgba(245, 184, 61, .16), transparent 70%),
      radial-gradient(900px 700px at 5000px 1250px, rgba(109, 91, 255, .42), transparent 70%),
      radial-gradient(900px 700px at 5900px 1300px, rgba(126, 224, 184, .2), transparent 70%),
      linear-gradient(90deg, #1B1464 0%, #2A1FA8 18%, #1B1464 36%, #2A1FA8 54%, #1B1464 72%, #2A1FA8 90%, #1B1464 100%); }
  .layer { position: absolute; inset: 0; }
  .head { position: absolute; top: 120px; width: 920px; color: #fff; }
  .eyebrow { display: inline-flex; align-items: center; gap: 14px; font-weight: 700; font-size: 30px; letter-spacing: 4px; color: var(--mint); text-transform: uppercase; }
  .eyebrow i { width: 44px; height: 6px; border-radius: 3px; background: var(--mint); display: block; }
  h1 { margin: 26px 0 0; font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -3px; }
  h1 em { font-style: normal; color: var(--mint); }
  h1 b { color: var(--gold); }
  .sub { margin-top: 28px; font-size: 40px; line-height: 1.3; color: var(--lav); font-weight: 500; max-width: 860px; }
  .phone { position: absolute; border-radius: 76px; padding: 18px; background: linear-gradient(145deg, #3a3480, #0d0a33 60%, #2b2570);
    box-shadow: 0 60px 120px rgba(5, 3, 30, .65), 0 0 0 3px rgba(255, 255, 255, .08) inset; }
  .phone img { display: block; width: 100%; border-radius: 60px; }
  .phone::before { content: ""; position: absolute; top: 34px; left: 50%; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: #05031a; }
  .folha { position: absolute; filter: drop-shadow(0 30px 40px rgba(5, 3, 30, .45)); }
  .bubble { position: absolute; background: #fff; color: #1B1464; font-weight: 800; font-size: 44px; padding: 26px 40px; border-radius: 48px;
    box-shadow: 0 24px 60px rgba(5, 3, 30, .45); white-space: nowrap; }
  .bubble::after { content: ""; position: absolute; width: 44px; height: 44px; background: #fff; transform: rotate(45deg); border-radius: 8px; }
  .bubble.bl::after { left: 70px; bottom: -16px; }
  .bubble.br::after { right: 70px; bottom: -16px; }
  .chip { position: absolute; display: flex; align-items: center; gap: 18px; background: rgba(255, 255, 255, .96); color: #1B1464; border-radius: 40px;
    padding: 24px 34px; font-weight: 800; font-size: 36px; box-shadow: 0 30px 70px rgba(5, 3, 30, .5); }
  .chip span { font-size: 26px; font-weight: 600; color: #5b5794; display: block; }
  .dot { width: 64px; height: 64px; border-radius: 22px; display: grid; place-items: center; font-size: 36px; flex: none; }
  .brand { position: absolute; display: flex; align-items: center; gap: 30px; color: #fff; }
  .brand img { width: 150px; height: 150px; border-radius: 40px; box-shadow: 0 24px 60px rgba(5, 3, 30, .55); }
  .brand b { font-size: 70px; font-weight: 800; letter-spacing: -2px; display: block; }
  .brand span { font-size: 34px; color: var(--lav); font-weight: 600; }
</style>
</head>
<body>
<div id="wrap"><div id="canvas">
  <svg class="layer" id="stars" width="6480" height="1920"></svg>
  <svg class="layer" width="6480" height="1920" viewBox="0 0 6480 1920">
    <defs>
      <linearGradient id="rib" x1="0" x2="6480" y1="0" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#3FBF8F"/><stop offset=".25" stop-color="#7EE0B8"/><stop offset=".5" stop-color="#B4F3D9"/>
        <stop offset=".75" stop-color="#7EE0B8"/><stop offset="1" stop-color="#3FBF8F"/>
      </linearGradient>
      <linearGradient id="ribShade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient>
    </defs>
    <!-- A fita verde do Folha atravessa as seis telas. -->
    <path id="ribbonPath" fill="none" stroke="url(#rib)" stroke-width="64" stroke-linecap="round"
      d="M-80 1640 C 300 1500, 700 1820, 1080 1700 S 1800 1420, 2160 1560 S 2900 1820, 3240 1690 S 3900 1400, 4320 1560 S 5050 1800, 5400 1660 S 6100 1500, 6600 1620"/>
    <path fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="10" stroke-linecap="round"
      d="M-80 1626 C 300 1486, 700 1806, 1080 1686 S 1800 1406, 2160 1546 S 2900 1806, 3240 1676 S 3900 1386, 4320 1546 S 5050 1786, 5400 1646 S 6100 1486, 6600 1606"/>
  </svg>
  <div class="layer" id="content"></div>
</div></div>

<script src="folha.js"></script>
<script>
  const content = document.getElementById("content");
  const add = (html) => content.insertAdjacentHTML("beforeend", html);
  const phone = (src, x, y, w, rot, z = 2) =>
    add(`<div class="phone" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${rot}deg);z-index:${z}"><img src="shots/${src}.png"></div>`);
  const head = (x, eyebrow, title, sub) =>
    add(`<div class="head" style="left:${x}px"><div class="eyebrow"><i></i>${eyebrow}</div><h1>${title}</h1><div class="sub">${sub}</div></div>`);
  const folha = (x, y, size, opts, z = 5) =>
    add(`<div class="folha" style="left:${x}px;top:${y}px;z-index:${z}">${folhaSvg({ size, armColor: "#A9A2FF", ...opts })}</div>`);
  const chip = (x, y, rot, icon, bg, title, sub, z = 6) =>
    add(`<div class="chip" style="left:${x}px;top:${y}px;transform:rotate(${rot}deg);z-index:${z}"><div class="dot" style="background:${bg}">${icon}</div><div>${title}<span>${sub}</span></div></div>`);

  // 1 · Abertura
  head(90, "Estudário", "Do edital<br>à <em>aprovação</em>.", "Seu concurso organizado, com um assistente que estuda junto com você.");
  phone("home", 330, 760, 640, -5);
  folha(10, 1300, 450, { mood: "talking", look: [0.6, -0.3] });
  add(`<div class="bubble bl" style="left:60px;top:1150px;z-index:6">Bora estudar?</div>`);

  // 2 · Edital → matérias
  head(1080 + 90, "Leitura do edital", "Mande o PDF.<br>Receba as <em>matérias</em>.", "Matérias e tópicos do seu edital organizados em minutos.");
  phone("concursos", 1080 + 70, 800, 600, 4, 2);
  // Atravessa a divisa entre as telas 2 e 3.
  phone("preparando", 1850, 900, 600, -7, 3);

  // 3 · Material completo
  head(2160 + 90, "Material completo", "Teoria, resumo<br>e <em>flashcards</em>.", "Tudo escrito para o seu tópico,<br>com fontes para conferir.");
  phone("leitura", 2160 + 480, 900, 560, 5, 2);
  chip(2160 + 60, 1600, -4, "📚", "#E6E3FF", "7 capítulos", "teoria do tópico", 6);

  // 4 · Questões
  head(3240 + 90, "Questões", "No estilo<br>da <em>sua banca</em>.", "Explicação em cada resposta, revisão dos erros e simulados.");
  phone("questao", 3240 + 150, 800, 620, -4, 2);
  // O Folha comemora em cima da divisa entre as telas 4 e 5.
  folha(4320 - 300, 1270, 600, { mood: "happy", look: [0, 0] }, 7);
  chip(3240 + 560, 1150, 5, "✓", "#CFF3E1", "Correto!", "+10 XP · sequência de 5", 8);

  // 5 · Plano
  head(4320 + 90, "Plano de estudos", "Um plano que<br>cabe na <em>sua rotina</em>.", "Monta sozinho a partir do edital, do seu tempo e da data da prova.");
  phone("plano", 4320 + 420, 860, 590, 4, 2);

  // 6 · Fechamento
  head(5400 + 90, "Todo dia conta", "Constância que<br>vira <b>aprovação</b>.", "Sequência, níveis e conquistas para não parar no meio do caminho.");
  phone("treinar", 5400 + 380, 860, 590, -4, 2);
  folha(5400 - 30, 1380, 400, { mood: "wink", look: [0.4, -0.2] }, 6);
  chip(5400 + 120, 1180, -5, "🔥", "#FFE3B8", "12 dias seguidos", "nível 4 · 1.240 XP", 6);

  // Estrelas espalhadas pelo painel todo (sempre as mesmas).
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let stars = "";
  for (let i = 0; i < 260; i++) {
    const x = rnd() * 6480, y = rnd() * 1920, r = rnd() * 2.4 + 0.6;
    stars += `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${(rnd() * 0.5 + 0.15).toFixed(2)}"/>`;
  }
  for (let i = 0; i < 22; i++) {
    const x = rnd() * 6480, y = rnd() * 1300, r = rnd() * 9 + 5, c = ["#FFE07A", "#7EE0B8", "#F4A6C0"][i % 3];
    stars += `<path fill="${c}" opacity=".85" d="M${x} ${y - r * 2}Q${x} ${y} ${x + r * 2} ${y}Q${x} ${y} ${x} ${y + r * 2}Q${x} ${y} ${x - r * 2} ${y}Q${x} ${y} ${x} ${y - r * 2}Z"/>`;
  }
  document.getElementById("stars").innerHTML = stars;

  // ?s=N mostra só a tela N; sem parâmetro, o painel inteiro (para conferir a emenda).
  const s = new URLSearchParams(location.search).get("s");
  const wrap = document.getElementById("wrap");
  if (s === null) { wrap.style.width = "6480px"; }
  else document.getElementById("canvas").style.left = `${-Number(s) * 1080}px`;
</script>
</body>
</html>
