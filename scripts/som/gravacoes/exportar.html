<!doctype html><meta charset=utf-8><body><script src="familia.js"></script><script>
// gera o WAV de cada som da família (mono, 44,1 kHz, 16 bits), com fim suave e sem silêncio sobrando
function wav(x){const n=x.length,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const s=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
s(0,"RIFF");v.setUint32(4,36+n*2,true);s(8,"WAVE");s(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,44100,true);v.setUint32(28,88200,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,"data");v.setUint32(40,n*2,true);
for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-32767,Math.min(32767,Math.round(x[i]*32767))),true);return new Uint8Array(buf)}
(async()=>{const dec=new OfflineAudioContext(1,1,44100),buffers={};for(const k in SAMPLES){const f=SAMPLES[k].f;if(!buffers[f])buffers[f]=await dec.decodeAudioData(await (await fetch(f+".mp3")).arrayBuffer())}
const out={};const lista=(new URLSearchParams(location.search).get("s")||Object.keys(FAMILIA).join(",")).split(",");
for(const nome of lista){const ctx=new OfflineAudioContext(1,44100*(FAMILIA[nome].cena?6.5:3.2),44100);await tocar(ctx,nome,buffers,0.01);const x=(await ctx.startRendering()).getChannelData(0);
let end=x.length;while(end>4410&&Math.abs(x[end-1])<0.0006)end--;end=Math.min(x.length,end+2205);const y=x.slice(0,end);const T=2205;for(let i=0;i<T;i++)y[y.length-1-i]*=i/T;
const b=wav(y);let bin="";for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));out[nome]=btoa(bin)}
window.RESULT=out;document.title="pronto";})();
</script>
