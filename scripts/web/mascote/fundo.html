<!doctype html><body style="margin:0;background:#2a2a2a"><canvas id=c></canvas><script>
const im = new Image();
im.onload = () => {
  const W = im.naturalWidth, H = im.naturalHeight;
  const c = document.getElementById("c"); c.width = W; c.height = H;
  const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, W, H), px = d.data;
  const col = (i) => [px[i * 4], px[i * 4 + 1], px[i * 4 + 2]];
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  // Crescimento de região a partir das bordas da imagem e das linhas entre as vistas.
  const bg = new Uint8Array(W * H), queue = new Int32Array(W * H); let qh = 0, qt = 0;
  const seed = (x, y) => { const i = y * W + x; if (!bg[i]) { bg[i] = 1; queue[qt++] = i; } };
  for (let x = 0; x < W; x++) { seed(x, 0); seed(x, H - 1); seed(x, 690); }
  for (let y = 0; y < H; y++) { seed(0, y); seed(W - 1, y); seed(606, y); }
  const STEP = +(new URLSearchParams(location.search).get("step") || 7);
  while (qh < qt) {
    const i = queue[qh++], x = i % W, y = (i / W) | 0, ci = col(i);
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const j = ny * W + nx; if (bg[j]) continue;
      const cj = col(j), sat = Math.max(...cj) - Math.min(...cj);
      if (dist(ci, cj) < STEP && sat < 26) { bg[j] = 1; queue[qt++] = j; }
    }
  }
  // Bolsões de fundo fechados (entre as pernas, embaixo do capelo): regiões grandes com a cor do fundo daquela linha.
  const rowBg = [];
  for (let y = 0; y < H; y++) for (const side of [0, 1]) {
    let n = 0, s = [0, 0, 0];
    for (let x = side ? 606 : 0; x < (side ? W : 606); x++) { const i = y * W + x; if (bg[i]) { const c = col(i); s[0] += c[0]; s[1] += c[1]; s[2] += c[2]; n++; } }
    rowBg[y * 2 + side] = n ? s.map((v) => v / n) : null;
  }
  const cand = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (bg[i]) continue; const b = rowBg[y * 2 + (x >= 606 ? 1 : 0)]; if (!b) continue;
    const c = col(i), sat = Math.max(...c) - Math.min(...c);
    if (sat < 22 && dist(c, b) < 16) cand[i] = 1;
  }
  const seen = new Uint8Array(W * H);
  for (let i0 = 0; i0 < W * H; i0++) {
    if (!cand[i0] || seen[i0]) continue;
    const comp = [i0]; seen[i0] = 1;
    for (let k = 0; k < comp.length; k++) { const i = comp[k], x = i % W, y = (i / W) | 0;
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue; const j = ny * W + nx; if (cand[j] && !seen[j]) { seen[j] = 1; comp.push(j); } } }
    let cx = 0, cy = 0; for (const i of comp) { cx += i % W; cy += (i / W) | 0; } cx /= comp.length; cy /= comp.length;
    const ZONES = [[740, 450, 880, 560], [770, 1140, 900, 1290], [300, 740, 430, 880], [620, 60, 760, 230], [960, 60, 1100, 240], [640, 740, 780, 880], [940, 740, 1100, 880]];
    const inZone = ZONES.some(([a, b, c, d]) => cx > a && cx < c && cy > b && cy < d);
    if (comp.length > 250 && inZone) for (const i of comp) bg[i] = 1;
  }
  // Alfa: fundo 0; borda (até 2 px do fundo) proporcional à diferença para o fundo vizinho, com a cor "descontaminada".
  const out = g.createImageData(W, H), o = out.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    if (bg[i]) { o[i * 4 + 3] = 0; continue; }
    let n = 0, s = [0, 0, 0];
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const j = ny * W + nx; if (bg[j]) { const cj = col(j); s[0] += cj[0]; s[1] += cj[1]; s[2] += cj[2]; n++; }
    }
    let a = 1, ci = col(i);
    if (n) {
      const b = s.map((v) => v / n); a = Math.max(0, Math.min(1, (dist(ci, b) - 7) / 46));
      if (a > 0.02) ci = ci.map((v, k) => Math.max(0, Math.min(255, (v - (1 - a) * b[k]) / a)));
    }
    o[i * 4] = ci[0]; o[i * 4 + 1] = ci[1]; o[i * 4 + 2] = ci[2]; o[i * 4 + 3] = Math.round(a * 255);
  }
  // Franja: a cor dos pixels meio transparentes vira a média dos vizinhos opacos (sem o cinza do fundo).
  const o2 = new Uint8ClampedArray(o);
  for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
    const i = (y * W + x) * 4, a = o[i + 3]; if (a === 0 || a >= 250) continue;
    let n = 0, s0 = 0, s1 = 0, s2 = 0;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) { const j = ((y + dy) * W + x + dx) * 4; if (o[j + 3] >= 250) { s0 += o[j]; s1 += o[j + 1]; s2 += o[j + 2]; n++; } }
    if (n) { o2[i] = s0 / n; o2[i + 1] = s1 / n; o2[i + 2] = s2 / n; }
    o2[i + 3] = Math.round(a * (n ? 0.92 : 0.6));
  }
  // Aperta a borda 1 px: os pixels colados no fundo ficam com a cor de 2-3 px para dentro (sem o
  // contorno claro que aparece em fundo escuro) e um pouco mais transparentes.
  const solid = (x, y) => o2[(y * W + x) * 4 + 3] > 0;
  const o3 = new Uint8ClampedArray(o2);
  for (let y = 3; y < H - 3; y++) for (let x = 3; x < W - 3; x++) {
    const i = (y * W + x) * 4; if (!o2[i + 3]) continue;
    let edge = false; for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) if (!solid(x + dx, y + dy)) edge = true;
    if (!edge) continue;
    let n = 0, s0 = 0, s1 = 0, s2 = 0;
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
      const xx = x + dx, yy = y + dy; let inner = true;
      for (const [ex, ey] of [[1,0],[-1,0],[0,1],[0,-1],[2,0],[-2,0],[0,2],[0,-2]]) if (!solid(xx + ex, yy + ey)) { inner = false; break; }
      if (inner) { const j = (yy * W + xx) * 4; s0 += o2[j]; s1 += o2[j + 1]; s2 += o2[j + 2]; n++; }
    }
    if (n) { o3[i] = s0 / n; o3[i + 1] = s1 / n; o3[i + 2] = s2 / n; }
    o3[i + 3] = o2[i + 3] * 0.7;
  }
  o2.set(o3);
  out.data.set(o2);
  g.putImageData(out, 0, 0);
  window.PNG = c.toDataURL("image/png");
  window.DONE = 1; window.INFO = "ok";
};
im.src = "../../../design/mascote/folha-turnaround.webp";
</script></body>
