project_id = "estudario-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[analytics]
enabled = false

[functions.ai-syllabus-worker]
# The worker uses an opaque backend token validated by its handler. The gateway
# must not attempt to validate that token as a Supabase JWT.
verify_jwt = false

[functions.ai-text-worker]
# Same opaque worker token as ai-syllabus-worker; validated by the handler.
verify_jwt = false

# O app web chama esta função do navegador: o preflight de CORS (OPTIONS) chega sem token e o
# gateway o recusaria. A função confere o token dela mesma (authenticateSupabaseRequest).
[functions.ai-syllabus-jobs]
verify_jwt = false

# Também chamada pelo app web (limites do plano); a função confere o token dela mesma.
[functions.ai-plan]
verify_jwt = false

# Assinaturas do Play: o app manda o token da compra e a função confere com o Google.
[functions.play-billing]
verify_jwt = false
